[project]
name = "savemoney"
version = "0.1.0"
description = "Учебное ядро управления личным бюджетом"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: requires binding a loopback HTTP socket"]

[tool.coverage.run]
source = ["savemoney", "main"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"
