[project]
name = "savemoney"
version = "0.2.0"
description = "Локальный сервер управления личным бюджетом"
requires-python = ">=3.13"

[dependency-groups]
runtime = [
    "pymongo==4.19.0",
    "requests==2.34.2",
]
dev = [
    { include-group = "runtime" },
    "coverage==7.17.2",
    "mongomock==4.3.0",
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: requires binding a loopback HTTP socket", "mongo: requires real MongoDB via SAVEMONEY_TEST_MONGO_URI"]

[tool.coverage.run]
source = ["savemoney", "main"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"
